<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="setting">
      <label>Markets</label>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="threshold" value="0.2" id="threshold-more">
          <span>Show more</span>
        </label>
        <label class="radio-option">
          <input type="radio" name="threshold" value="0.5" id="threshold-balanced" checked>
          <span>Balanced</span>
        </label>
        <label class="radio-option">
          <input type="radio" name="threshold" value="0.8" id="threshold-less">
          <span>Show less</span>
        </label>
      </div>
    </div>
    
  </div>

  <script src="popup.js"></script>
</body>
</html>
